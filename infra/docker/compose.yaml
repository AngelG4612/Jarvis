  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../../services/mosquitto:/mosquitto
      - ../../services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

