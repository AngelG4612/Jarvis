networks:
  ha-net:
    driver: bridge

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    # networks:
    #   - ha-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../../services/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro   # <-- needed for Bluetooth
    environment:
      - TZ=America/Chicago
    ports:
      - "8123:8123"

  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    # if --help didn't show --uri, try: image: rhasspy/wyoming-piper:1.4.0
    container_name: wyoming-piper
    network_mode: host
    command: ["--uri","tcp://0.0.0.0:10200","--voice","en_US-lessac-medium","--data-dir","/data"]
    volumes:
      - ./voice/piper:/data
    restart: unless-stopped

  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    # if --help didn't show --uri, try: image: rhasspy/wyoming-whisper:1.4.0
    container_name: wyoming-whisper
    network_mode: host
    command: ["--uri","tcp://0.0.0.0:10300","--model","small","--language","en","--data-dir","/data"]
    volumes:
      - ./voice/whisper:/data
    restart: unless-stopped

  # wyoming-openwakeword:
  #   image: rhasspy/wyoming-openwakeword:latest
  #   container_name: wyoming-openwakeword
  #   network_mode: host
  #   command: ["--uri","tcp://0.0.0.0:10400","--preload-model","ok_nabu","--preload-model","hey_jarvis"]
  #   restart: unless-stopped

  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: wyoming-openwakeword
    network_mode: host
    command:
      [
        "--uri","tcp://0.0.0.0:10400",
        "--preload-model","ok_nabu",
        "--preload-model","hey_jarvis",
        "--threshold","0.5",       # lower = more sensitive (try 0.4–0.6)
        "--debug"                  # prints scores/detections
      ]
    restart: unless-stopped



  
    
